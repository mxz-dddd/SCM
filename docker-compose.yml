name: scm-cloud

services:
  postgres:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300
      - -c
      - archive_command=mkdir -p /var/lib/postgresql/data/wal-archive && test ! -f /var/lib/postgresql/data/wal-archive/%f && cp %p /var/lib/postgresql/data/wal-archive/%f
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scm}
      POSTGRES_USER: ${POSTGRES_USER:-scm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scm-local-only}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-scm-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-scm-local-secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - minio-data:/data

  optimizer:
    image: scm-optimizer:9.14.6206
    build:
      context: ./services/optimizer
      dockerfile: Dockerfile
    environment:
      OPTIMIZER_HOST: 0.0.0.0
      OPTIMIZER_PORT: 8090
    ports:
      - '${OPTIMIZER_PORT:-8090}:8090'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  minio-data:
  postgres-data:
  redis-data:
